core:
  version: "1.0"
  preset: "balanced"
  language: "en"

network:
  ingress:
    http:
      enabled: true
      listen_addr: "127.0.0.1:4010"
  egress:
    upstream_url: "http://127.0.0.1:4020"

whitelist:
  enforce_tool_whitelist: true
  allowed_tools:
    - "lookup_customer"
    - "send_audit"
    - "safe_tool"
