name: JaguarGate Automated Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to release (e.g. v1.0.3)"
        required: true
        default: "v1.0.3"

permissions:
  contents: write

jobs:
  release:
    name: Cross-Compile & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run full test suite before releasing
        run: go test -race -count=1 ./...

      - name: Cross-compile static binaries (Linux, macOS, Windows) & SHA-256 Checksums
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "dist/jgate-${TAG_NAME}-linux-amd64" ./cmd/jgate
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "dist/jgate-${TAG_NAME}-linux-arm64" ./cmd/jgate
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "dist/jgate-${TAG_NAME}-darwin-arm64" ./cmd/jgate
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "dist/jgate-${TAG_NAME}-darwin-amd64" ./cmd/jgate
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "dist/jgate-${TAG_NAME}-windows-amd64.exe" ./cmd/jgate
          (cd dist && sha256sum jgate-* > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release with Binary Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "🐆 JaguarGate (jgate) ${{ github.event.inputs.tag || github.ref_name }} — Enterprise AI & MCP Security Gateway"
          generate_release_notes: true
          files: |
            dist/jgate-*
            dist/SHA256SUMS.txt
