name: JaguarGate CI & Security Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Test, Race Detector & Pounce Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go (Latest Stable)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit, E2E & example validation tests with Race Detector
        run: go test -v -race -count=1 ./...

      - name: Build static jgate binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o jgate ./cmd/jgate

      - name: Install Enterprise Security Scanners (Govulncheck & GoSec)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Govulncheck (Dependency Supply-Chain Audit)
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Run GoSec (SAST Static Analysis)
        run: $(go env GOPATH)/bin/gosec -exclude-dir=examples ./...

      - name: Execute built-in OWASP & MCP Red-Teaming Suite (jgate pounce)
        run: ./jgate pounce

      - name: Execute Gate 5 Self-Contained 4-Stage Bilateral Audit Suite
        run: bash docs/security/jaguargate-audit-pack/reproduce/run_reproduce.sh 4010 4020

      - name: Upload Gate 5 Bilateral Audit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate5-bilateral-report-${{ github.sha }}
          path: docs/security/jaguargate-audit-pack/findings/full_campaign_report.json
          if-no-files-found: error
